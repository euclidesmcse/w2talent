name: CI — build + testes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    # Postgres + pgvector efêmero só para os testes de integração (tests/integration.test.ts)
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: w2talent
          POSTGRES_PASSWORD: w2talent
          POSTGRES_DB: w2talent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U w2talent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://w2talent:w2talent@localhost:5432/w2talent?sslmode=disable
      BETTER_AUTH_SECRET: dummy-ci-better-auth-secret-0123456789abcdef
      CRON_SECRET: dummy-ci-cron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm test -- --runInBand
      # build do OpenNext (next build + .open-next), o mesmo bundle que a Cloudflare publica
      - run: npm run build
